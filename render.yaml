# =============================================================================
# Render Blueprint for NEXA AI Personal Assistant
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: nexa-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DEFAULT_TIMEZONE
        value: Africa/Addis_Ababa
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexa-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # Set in Render Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: N8N_BASE_URL
        sync: false
      - key: N8N_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Celery Background Worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: nexa-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: celery -A app.workers.celery_app worker --loglevel=info -Q default,reminders,notifications
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexa-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: nexa-api
          envVarKey: SECRET_KEY
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: nexa-api
          envVarKey: JWT_SECRET_KEY
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: nexa-api
          envVarKey: ENCRYPTION_KEY

  # ---------------------------------------------------------------------------
  # 3. Redis Instance (for Celery & Caching)
  # ---------------------------------------------------------------------------
  - type: redis
    name: nexa-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction

# -----------------------------------------------------------------------------
# 4. Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: nexa-postgres
    region: oregon
    plan: starter
    databaseName: nexa
    user: nexa_user

