[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexa"
version = "0.1.0"
description = "NEXA – AI-powered personal executive assistant backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # Pydantic & settings
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",

    # Database
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",

    # Authentication
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "cryptography==43.0.3",

    # AI
    "openai==1.57.0",
    "tiktoken==0.8.0",

    # Background jobs
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "kombu==5.4.2",

    # HTTP client
    "httpx==0.28.1",

    # Google APIs
    "google-auth==2.37.0",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.154.0",

    # Telegram
    "python-telegram-bot==21.9",

    # Utilities
    "structlog==24.4.0",
    "python-dateutil==2.9.0",
    "pytz==2024.2",
    "orjson==3.10.12",
    "slowapi==0.1.9",
    "limits==3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "anyio==4.7.0",
    "asgi-lifespan==2.1.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "types-python-jose==3.3.4.20240106",
    "types-pytz==2024.2.0.20241003",
    "types-python-dateutil==2.9.0.20241206",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "E501", "B904", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

